# Amazon Ads daily report table — Amazon's own report columns, in display order.
# field = raw value from the platform; formula = derived. headline = native efficiency metric.

metrics:
  - {label: Spend, field: spend}
  - {label: Sales, field: sales}                     # attributed sales value (attribution window per report)
  - {label: Orders, field: purchases}
  - {label: Units, field: units_sold}
  - {label: Clicks, field: clicks}
  - {label: "Impr.", field: impressions}
  - {label: CTR, formula: "clicks / impressions * 100"}
  - {label: CPC, formula: "spend / clicks"}
  - {label: ACOS, formula: "spend / sales * 100", headline: true}
  - {label: ROAS, formula: "sales / spend"}
  - {label: "Top-of-Search IS", field: top_of_search_impression_share}   # % of eligible top-of-search impressions won
  - {label: "NTB Sales %", field: ntb_sales_pct}     # new-to-brand share of sales (SB/SD)
