# Daily report tables — the metrics per platform, in display order.
# field = raw value from the platform; formula = derived from those fields.
# headline = the platform's native efficiency metric.

amazon:
  - {label: Spend, field: spend}
  - {label: Sales, field: sales}
  - {label: Units, field: units}
  - {label: Clicks, field: clicks}
  - {label: "Impr.", field: impressions}
  - {label: ACOS, formula: "spend / sales * 100", headline: true}
  - {label: ROAS, formula: "sales / spend"}
  - {label: CPC, formula: "spend / clicks"}
  - {label: CVR, formula: "orders / clicks * 100"}
  - {label: AOV, formula: "sales / orders"}

flipkart:
  - {label: Spend, field: spend}
  - {label: Sales, field: sales}
  - {label: Units, field: units}
  - {label: Clicks, field: clicks}
  - {label: Views, field: impressions}                        # Flipkart's word for impressions
  - {label: ROI, formula: "sales / spend", headline: true}    # includes indirect (halo) sales
  - {label: Direct ROI, formula: "direct_sales / spend"}
  - {label: CPC, formula: "spend / clicks"}
  - {label: CVR, formula: "orders / clicks * 100"}
  - {label: AOV, formula: "sales / orders"}

meta:
  - {label: Spend, field: spend}
  - {label: Revenue, field: purchase_value}
  - {label: Purchases, field: purchases}
  - {label: Link Clicks, field: link_clicks}                  # not Clicks (all)
  - {label: "Impr.", field: impressions}
  - {label: ROAS, formula: "purchase_value / spend", headline: true}   # no ACOS on Meta
  - {label: CPM, formula: "spend / impressions * 1000"}
  - {label: CPC, formula: "spend / link_clicks"}
  - {label: CTR, formula: "link_clicks / impressions * 100"}
  - {label: CPA, formula: "spend / purchases"}
  - {label: AOV, formula: "purchase_value / purchases"}

google:
  - {label: Cost, field: cost}
  - {label: "Conv. Value", field: conv_value}
  - {label: "Conv.", field: conversions}
  - {label: Clicks, field: clicks}
  - {label: "Impr.", field: impressions}
  - {label: "Conv. Val / Cost", formula: "conv_value / cost", headline: true}   # Google's ROAS — no ACOS
  - {label: CPC, formula: "cost / clicks"}
  - {label: CVR, formula: "conversions / clicks * 100"}
  - {label: CPA, formula: "cost / conversions"}
  - {label: AOV, formula: "conv_value / conversions"}

shopify:
  - {label: Sessions, field: sessions}
  - {label: Orders, field: orders}
  - {label: Total Sales, field: total_sales}
  - {label: CVR, formula: "orders / sessions * 100", headline: true}
  - {label: AOV, formula: "total_sales / orders"}
  - {label: "Returning %", formula: "returning_orders / orders * 100"}
