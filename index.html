<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-Platform Ads Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1B2430; --ink-2:#5A6572; --ink-3:#8B95A1;
  --line:#E4E8ED; --line-soft:#EEF1F4; --total-bg:#161D28; --total-ink:#F2F5F8;
  --row-alt:#FBFCFD; --band-ink:#FFFFFF;
  --amz:#C0531F; --amz-tint:#FDF7F3;
  --fk:#C99700; --fk-tint:#FDFAF0;
  --meta:#0866FF; --meta-tint:#F3F7FE;
  --goog:#1E8E3E; --goog-tint:#F3FAF5;
  --shp:#5C7F29; --shp-tint:#F6F9F1;
  --bad:#C0392B; --chip-bad-bg:#FBEDEB; --chip-ok-bg:#EDF6EF; --chip-ok:#1E7A3C;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#12161C; --surface:#1A2028; --ink:#E8ECF1; --ink-2:#9AA6B3; --ink-3:#6E7A87;
    --line:#2A323D; --line-soft:#232A34; --total-bg:#060809; --total-ink:#EDF1F5;
    --row-alt:#1E252E;
    --amz-tint:#251A13; --fk-tint:#241F10; --meta-tint:#131C2B; --goog-tint:#13221A; --shp-tint:#181F10;
    --bad:#E06052; --chip-bad-bg:#33201D; --chip-ok-bg:#1B2B20; --chip-ok:#5FBF7C;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2028; --ink:#E8ECF1; --ink-2:#9AA6B3; --ink-3:#6E7A87;
  --line:#2A323D; --line-soft:#232A34; --total-bg:#060809; --total-ink:#EDF1F5;
  --row-alt:#1E252E;
  --amz-tint:#251A13; --fk-tint:#241F10; --meta-tint:#131C2B; --goog-tint:#13221A; --shp-tint:#181F10;
  --bad:#E06052; --chip-bad-bg:#33201D; --chip-ok-bg:#1B2B20; --chip-ok:#5FBF7C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;margin:0;padding:28px 28px 48px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px}
.sample{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-2);font:inherit;font-size:14px;font-weight:500;padding:9px 14px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--meta);outline-offset:-2px}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.scroller{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:16px}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 13px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line-soft)}
thead .bands th{padding:8px 13px;text-align:center;color:var(--band-ink);font-size:12.5px;font-weight:700;letter-spacing:.14em;border-bottom:none}
thead .cols th{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
th.rowlab,td.rowlab{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);font-weight:600;min-width:118px}
thead .bands th.rowlab{background:var(--surface)}
td .dow{color:var(--ink-3);font-weight:400;font-size:12px;margin-left:5px}
tbody tr:nth-child(even) td{background:var(--row-alt)}
tbody tr:nth-child(even) td.rowlab{background:var(--row-alt)}
td.hl{font-weight:700}
td.first,th.first{border-left:1px solid var(--line)}
tr.total td{background:var(--total-bg)!important;color:var(--total-ink);border-bottom:none;font-weight:600}
tr.total td.rowlab{background:var(--total-bg)!important;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
tr.total td.hl{font-weight:700}
.grouprow td{background:var(--surface)!important;text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.12em;padding-top:14px;border-bottom:1px solid var(--line)}
.note{color:var(--ink-2);font-size:12.5px;margin:10px 2px 0}
h2{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:34px 0 12px}
.contracts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.contract{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:3px solid var(--line)}
.contract h3{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{font-size:11.5px;font-weight:600;border-radius:99px;padding:2.5px 10px}
.chip.ok{background:var(--chip-ok-bg);color:var(--chip-ok)}
.chip.no{background:var(--chip-bad-bg);color:var(--bad);text-decoration:line-through}
.contract p{margin:0;color:var(--ink-2);font-size:12.5px;line-height:1.55}
.contract code{font-family:inherit;font-weight:600;color:var(--ink);background:none}
</style>

</head>
<body>
<div class="head">
  <h1>Cross-Platform Ads Log</h1>
  <span class="sub">Pre-built report · every platform in its own vocabulary</span>
  <span class="sample">Sample data · 1–5 Sept 2026</span>
</div>

<div class="tabs" role="tablist" id="tabs"></div>
<div class="scroller"><table id="tbl"></table></div>
<p class="note" id="tabnote"></p>


<script>
/* ---------- formatting (Indian grouping) ---------- */
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const inr2 = n => "₹" + n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = n => Math.round(n).toLocaleString("en-IN");
const pct = n => n.toFixed(2) + "%";
const pct1 = n => n.toFixed(1) + "%";
const mult = n => n.toFixed(2) + "x";

/* ---------- platform definitions: columns + native vocabulary ---------- */
/* base row fields: spend, sales, orders, units, clicks, impressions (+sessions for shopify) */
const PLATFORMS = [
  {key:"amazon", name:"AMAZON", color:"var(--amz)",
   cols:[
    {h:"Spend",   f:r=>inr(r.spend)},
    {h:"Sales",   f:r=>inr(r.sales)},
    {h:"Units",   f:r=>num(r.units)},
    {h:"Clicks",  f:r=>num(r.clicks)},
    {h:"Impr.",   f:r=>num(r.impressions)},
    {h:"ACOS",    f:r=>pct1(r.spend/r.sales*100), hl:true},
    {h:"ROAS",    f:r=>mult(r.sales/r.spend)},
    {h:"CPC",     f:r=>inr2(r.spend/r.clicks)},
    {h:"CVR",     f:r=>pct(r.orders/r.clicks*100)},
    {h:"AOV",     f:r=>inr2(r.sales/r.orders)},
   ]},
  {key:"flipkart", name:"FLIPKART", color:"var(--fk)",
   cols:[
    {h:"Spend",     f:r=>inr(r.spend)},
    {h:"Sales",     f:r=>inr(r.sales)},
    {h:"Units",     f:r=>num(r.units)},
    {h:"Clicks",    f:r=>num(r.clicks)},
    {h:"Views",     f:r=>num(r.impressions)},
    {h:"ROI",       f:r=>mult(r.sales/r.spend), hl:true},
    {h:"Direct ROI",f:r=>mult(r.directSales/r.spend)},
    {h:"CPC",       f:r=>inr2(r.spend/r.clicks)},
    {h:"CVR",       f:r=>pct(r.orders/r.clicks*100)},
    {h:"AOV",       f:r=>inr2(r.sales/r.orders)},
   ]},
  {key:"meta", name:"META", color:"var(--meta)",
   cols:[
    {h:"Spend",      f:r=>inr(r.spend)},
    {h:"Revenue",    f:r=>inr(r.sales)},
    {h:"Purchases",  f:r=>num(r.orders)},
    {h:"Link Clicks",f:r=>num(r.clicks)},
    {h:"Impr.",      f:r=>num(r.impressions)},
    {h:"ROAS",       f:r=>mult(r.sales/r.spend), hl:true},
    {h:"CPM",        f:r=>inr2(r.spend/r.impressions*1000)},
    {h:"CPC",        f:r=>inr2(r.spend/r.clicks)},
    {h:"CTR",        f:r=>pct(r.clicks/r.impressions*100)},
    {h:"CPA",        f:r=>inr2(r.spend/r.orders)},
    {h:"AOV",        f:r=>inr2(r.sales/r.orders)},
   ]},
  {key:"google", name:"GOOGLE", color:"var(--goog)",
   cols:[
    {h:"Cost",        f:r=>inr(r.spend)},
    {h:"Conv. Value", f:r=>inr(r.sales)},
    {h:"Conv.",       f:r=>num(r.orders)},
    {h:"Clicks",      f:r=>num(r.clicks)},
    {h:"Impr.",       f:r=>num(r.impressions)},
    {h:"Conv. Val / Cost", f:r=>mult(r.sales/r.spend), hl:true},
    {h:"CPC",         f:r=>inr2(r.spend/r.clicks)},
    {h:"CVR",         f:r=>pct(r.orders/r.clicks*100)},
    {h:"CPA",         f:r=>inr2(r.spend/r.orders)},
    {h:"AOV",         f:r=>inr2(r.sales/r.orders)},
   ]},
  {key:"shopify", name:"SHOPIFY · STORE", color:"var(--shp)",
   cols:[
    {h:"Sessions",    f:r=>num(r.sessions)},
    {h:"Orders",      f:r=>num(r.orders)},
    {h:"Total Sales", f:r=>inr(r.sales)},
    {h:"CVR",         f:r=>pct(r.orders/r.sessions*100)},
    {h:"AOV",         f:r=>inr2(r.sales/r.orders)},
    {h:"Returning %", f:r=>pct1(r.returning/r.orders*100)},
   ]},
];

/* ---------- sample daily data (Amazon + Flipkart mirror the reference screenshot) ---------- */
const DAYS = [
  {d:"5 Sept", dow:"Sat"}, {d:"4 Sept", dow:"Fri"}, {d:"3 Sept", dow:"Thu"},
  {d:"2 Sept", dow:"Wed"}, {d:"1 Sept", dow:"Tue"},
];
const DAILY = {
  amazon: [
    {spend:20950, sales:9430, orders:21, units:21, clicks:455, impressions:221340},
    {spend:14210, sales:8260, orders:19, units:19, clicks:338, impressions:141020},
    {spend:17410, sales:11020, orders:27, units:27, clicks:391, impressions:174480},
    {spend:17980, sales:11350, orders:28, units:28, clicks:442, impressions:192370},
    {spend:18760, sales:16110, orders:41, units:41, clicks:439, impressions:301120},
  ],
  flipkart: [
    {spend:7480, sales:5590, directSales:4420, orders:12, units:12, clicks:549, impressions:93210},
    {spend:6430, sales:5880, directSales:4870, orders:11, units:11, clicks:583, impressions:85630},
    {spend:9310, sales:6180, directSales:4700, orders:14, units:14, clicks:693, impressions:103870},
    {spend:8890, sales:7280, directSales:5750, orders:16, units:16, clicks:764, impressions:114520},
    {spend:10650, sales:7020, directSales:5270, orders:15, units:15, clicks:1104, impressions:191330},
  ],
  meta: [
    {spend:18450, sales:38120, orders:52, clicks:912, impressions:88410},
    {spend:17210, sales:41710, orders:57, clicks:874, impressions:81260},
    {spend:19880, sales:35240, orders:48, clicks:1004, impressions:96530},
    {spend:16740, sales:44980, orders:61, clicks:846, impressions:78940},
    {spend:20310, sales:39660, orders:54, clicks:1061, impressions:101280},
  ],
  google: [
    {spend:9840, sales:16230, orders:24, clicks:402, impressions:31240},
    {spend:8610, sales:18940, orders:28, clicks:361, impressions:27810},
    {spend:11020, sales:14380, orders:21, clicks:447, impressions:35120},
    {spend:9270, sales:17650, orders:26, clicks:388, impressions:29480},
    {spend:10460, sales:15910, orders:23, clicks:421, impressions:33260},
  ],
  shopify: [
    {sessions:4120, orders:86, sales:41890, returning:24},
    {sessions:3860, orders:92, sales:45210, returning:27},
    {sessions:4480, orders:79, sales:37960, returning:21},
    {sessions:3940, orders:97, sales:47820, returning:30},
    {sessions:4610, orders:84, sales:40350, returning:23},
  ],
};

/* weekly / monthly synth: scale the 5-day sums by period factors */
const WEEKS  = [{d:"Wk 36", dow:"1–7 Sep", f:1.38},{d:"Wk 35", dow:"25–31 Aug", f:1.31},{d:"Wk 34", dow:"18–24 Aug", f:1.44},{d:"Wk 33", dow:"11–17 Aug", f:1.26}];
const MONTHS = [{d:"Sept", dow:"MTD", f:1.0},{d:"Aug", dow:"", f:5.9},{d:"July", dow:"", f:5.4},{d:"June", dow:"", f:6.2}];

function sumRows(rows){
  const t = {};
  rows.forEach(r => Object.keys(r).forEach(k => t[k] = (t[k]||0) + r[k]));
  return t;
}
function scaleRow(r, f, j){
  const o = {};
  Object.keys(r).forEach((k,i) => o[k] = r[k] * f * (1 + 0.07*Math.sin(j*2.7 + i)));
  return o;
}
function periodRows(periods){
  const base = {}; PLATFORMS.forEach(p => base[p.key] = sumRows(DAILY[p.key]));
  return periods.map((pd,j) => { const row={}; PLATFORMS.forEach(p=>row[p.key]=scaleRow(base[p.key],pd.f,j)); return row; });
}

/* ---------- placement mixes (native placement names per platform) ---------- */
const PLACEMENTS = {
  amazon:  [["Top of Search",.42,1.35],["Rest of Search",.33,.85],["Product Pages",.25,.72]],
  flipkart:[["Top of Search",.38,1.30],["Rest of Search",.27,.82],["Browse",.19,.70],["Product Page",.16,.95]],
  meta:    [["Feed",.44,1.15],["Reels",.26,.92],["Stories",.18,.85],["Audience Network",.12,.55]],
  google:  [["Google Search",.62,1.20],["Search Partners",.14,.70],["Display Network",.24,.65]],
};

/* ---------- table renderers ---------- */
const tbl = document.getElementById("tbl");
function bandHeader(plats, firstLabel){
  let h = `<thead><tr class="bands"><th class="rowlab">${firstLabel}</th>`;
  plats.forEach(p => h += `<th colspan="${p.cols.length}" style="background:${p.color}">${p.name}</th>`);
  h += `</tr><tr class="cols"><th class="rowlab"></th>`;
  plats.forEach(p => p.cols.forEach((c,i) => h += `<th class="${i===0?"first":""}">${c.h}</th>`));
  return h + `</tr></thead>`;
}
function dataRow(label, sub, rowByPlat, plats, cls){
  let h = `<tr class="${cls||""}"><td class="rowlab">${label}${sub?`<span class="dow">${sub}</span>`:""}</td>`;
  plats.forEach(p => p.cols.forEach((c,i) => {
    const r = rowByPlat[p.key];
    h += `<td class="${c.hl?"hl ":""}${i===0?"first":""}">${r?c.f(r):"—"}</td>`;
  }));
  return h + "</tr>";
}
function renderPeriodTable(periods, rows, firstLabel, totalLabel){
  let h = bandHeader(PLATFORMS, firstLabel) + "<tbody>";
  periods.forEach((pd,i) => h += dataRow(`<strong>${pd.d}</strong>`, pd.dow, rows[i], PLATFORMS));
  const tot = {}; PLATFORMS.forEach(p => tot[p.key] = sumRows(rows.map(r=>r[p.key])));
  h += dataRow(totalLabel, "", tot, PLATFORMS, "total") + "</tbody>";
  tbl.innerHTML = h;
}
function placementRows(scaleF){
  /* returns [{plat, name, row}] with base = 5-day sums split by mix */
  const out = [];
  PLATFORMS.filter(p=>PLACEMENTS[p.key]).forEach(p => {
    const base = sumRows(DAILY[p.key]);
    PLACEMENTS[p.key].forEach(([name, share, eff]) => {
      const r = {};
      Object.keys(base).forEach(k => r[k] = base[k]*share*scaleF);
      ["sales","orders","units","directSales"].forEach(k => { if(k in r) r[k] *= eff; });
      out.push({plat:p, name, row:r});
    });
  });
  return out;
}
function renderPlacementWeekly(){
  const plats = PLATFORMS.filter(p=>PLACEMENTS[p.key]);
  let h = `<thead><tr class="cols"><th class="rowlab">Placement</th><th class="first">Spend</th><th>Sales</th><th>Clicks</th><th>Impr. / Views</th><th>Efficiency</th><th>CPC</th><th>CVR</th></tr></thead><tbody>`;
  plats.forEach(p => {
    h += `<tr class="grouprow"><td class="rowlab" style="color:${p.color}">${p.name}</td><td colspan="7" style="color:${p.color};font-size:10.5px;text-align:right">${effLabel(p)} · Wk 36</td></tr>`;
    placementRows(1.38).filter(x=>x.plat===p).forEach(x => {
      const r = x.row;
      h += `<tr><td class="rowlab" style="font-weight:500">${x.name}</td>
        <td class="first">${inr(r.spend)}</td><td>${inr(r.sales)}</td><td>${num(r.clicks)}</td><td>${num(r.impressions)}</td>
        <td class="hl">${effValue(p,r)}</td><td>${inr2(r.spend/r.clicks)}</td><td>${pct(r.orders/r.clicks*100)}</td></tr>`;
    });
  });
  tbl.innerHTML = h + "</tbody>";
}
function renderPlacementMoM(){
  const plats = PLATFORMS.filter(p=>PLACEMENTS[p.key]);
  const months = [["June",6.2],["July",5.4],["Aug",5.9],["Sept (MTD)",1.0]];
  let h = `<thead><tr class="cols"><th class="rowlab">Placement</th>`;
  months.forEach((m,i) => h += `<th class="${i===0?"first":""}">${m[0]}</th>`);
  h += `<th>Spend · Sept</th><th>Δ eff. vs Aug</th></tr></thead><tbody>`;
  plats.forEach(p => {
    h += `<tr class="grouprow"><td class="rowlab" style="color:${p.color}">${p.name}</td><td colspan="${months.length+2}" style="color:${p.color};font-size:10.5px;text-align:right">${effLabel(p)} by month</td></tr>`;
    PLACEMENTS[p.key].forEach(([name, share, eff], pi) => {
      h += `<tr><td class="rowlab" style="font-weight:500">${name}</td>`;
      let prev=null, cur=null, curSpend=0;
      months.forEach((m,mi) => {
        const base = sumRows(DAILY[p.key]);
        const drift = 1 + 0.06*Math.sin(mi*1.9 + pi*1.3);
        const r = {}; Object.keys(base).forEach(k => r[k] = base[k]*share*m[1]);
        ["sales","orders","units","directSales"].forEach(k => { if(k in r) r[k] *= eff*drift; });
        const v = effNumber(p,r);
        if(mi===months.length-2) prev=v;
        if(mi===months.length-1){ cur=v; curSpend=r.spend; }
        h += `<td class="${mi===0?"first":""}">${effValue(p,r)}</td>`;
      });
      const d = cur-prev, isPct = p.key==="amazon";
      h += `<td>${inr(curSpend)}</td><td style="color:${(isPct? d<0 : d>0)?"var(--chip-ok)":"var(--bad)"};font-weight:600">${d>=0?"+":""}${isPct? d.toFixed(1)+" pp" : d.toFixed(2)+"x"}</td></tr>`;
    });
  });
  tbl.innerHTML = h + "</tbody>";
}
function effLabel(p){ return p.key==="amazon"?"ACOS":p.key==="flipkart"?"ROI":p.key==="google"?"Conv. Val / Cost":"ROAS"; }
function effNumber(p,r){ return p.key==="amazon" ? r.spend/r.sales*100 : r.sales/r.spend; }
function effValue(p,r){ return p.key==="amazon" ? pct1(effNumber(p,r)) : mult(effNumber(p,r)); }

/* ---------- tabs ---------- */
const VIEWS = [
  {name:"Daily Log", note:"Rates on the total row are recomputed from summed counts, never averaged. Each platform speaks its own language: ACOS on Amazon, ROI on Flipkart, ROAS on Meta, Conv. Value / Cost on Google.",
   render:()=>{ const rows = DAYS.map((_,i)=>{const r={};PLATFORMS.forEach(p=>r[p.key]=DAILY[p.key][i]);return r;});
     let h = bandHeader(PLATFORMS,"Date") + "<tbody>";
     DAYS.forEach((d,i)=> h += dataRow(`<strong>${d.d}</strong>`, d.dow, rows[i], PLATFORMS));
     const tot={};PLATFORMS.forEach(p=>tot[p.key]=sumRows(DAILY[p.key]));
     h += dataRow("Total · 5D","",tot,PLATFORMS,"total")+"</tbody>"; tbl.innerHTML=h; }},
  {name:"Weekly Summary", note:"Monday-start weeks; the current week is partial and labeled so.",
   render:()=>renderPeriodTable(WEEKS, periodRows(WEEKS), "Week", "Total · 4W")},
  {name:"Monthly Summary", note:"Calendar months; September is month-to-date.",
   render:()=>renderPeriodTable(MONTHS, periodRows(MONTHS), "Month", "Total · 4M")},
  {name:"Weekly Placement", note:"Placement names are each platform's own: Top of Search / Product Pages on marketplaces, Feed / Reels on Meta, Search / Display on Google. Shopify has no placements — it is the store ledger, not an ad platform.",
   render:renderPlacementWeekly},
  {name:"Placement MoM", note:"Efficiency by month per placement. Δ is green when the native metric improved — that means ACOS falling on Amazon, the multiplier rising everywhere else.",
   render:renderPlacementMoM},
];
const tabsEl = document.getElementById("tabs"), noteEl = document.getElementById("tabnote");
VIEWS.forEach((v,i) => {
  const b = document.createElement("button");
  b.className = "tab" + (i===0?" on":""); b.role="tab"; b.textContent = v.name;
  b.onclick = () => { document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on")); b.classList.add("on"); v.render(); noteEl.textContent = v.note; };
  tabsEl.appendChild(b);
});
VIEWS[0].render(); noteEl.textContent = VIEWS[0].note;

</script>

</body>
</html>
