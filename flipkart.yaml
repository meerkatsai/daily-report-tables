# Flipkart Ads daily report table — Flipkart's own report columns, in display order.
# field = raw value from the platform; formula = derived. headline = native efficiency metric.
# Flipkart splits everything direct (advertised product) vs indirect (halo) — the table keeps that split.

metrics:
  - {label: Spend, field: spend}
  - {label: Views, field: views}                     # Flipkart's word for impressions
  - {label: Clicks, field: clicks}
  - {label: CTR, formula: "clicks / views * 100"}
  - {label: CPC, formula: "spend / clicks"}
  - {label: PPV, field: product_page_views}          # product-page views from the ad click
  - {label: ATC, field: add_to_cart}                 # add-to-cart actions from the ad click
  - {label: Orders, field: orders}
  - {label: CVR, formula: "orders / clicks * 100"}   # Flipkart's orders include view-attributed — CVR runs on that basis by design
  - {label: Direct Units, field: direct_units}
  - {label: Indirect Units, field: indirect_units}
  - {label: Direct Revenue, field: direct_revenue}
  - {label: Indirect Revenue, field: indirect_revenue}
  - {label: ROI, formula: "(direct_revenue + indirect_revenue) / spend", headline: true}
  - {label: Direct ROI, formula: "direct_revenue / spend"}
  - {label: Indirect ROI, formula: "indirect_revenue / spend"}
